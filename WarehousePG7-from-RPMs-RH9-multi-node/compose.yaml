services:
  # Workaround for a Docker Desktop for Mac (VirtioFS) bug: freshly-created
  # host subdirectories aren't visible to the daemon's bind-mount code until
  # a container has mounted them once. This service touches every DB service's
  # bind-mount source on startup, exits immediately, and gates the rest of
  # the topology via `depends_on: condition: service_completed_successfully`.
  filesharewarmer:
    image: alpine
    platform: linux/amd64
    command: /bin/true
    volumes:
      - ./data/coordinator/data:/x/coordinator
      - ./data/standby/data:/x/standby
      - ./data/seg1/data:/x/seg1
      - ./data/seg2/data:/x/seg2
      - ./data/gpfdist/data:/x/gpfdist

  coordinator:
    depends_on:
      filesharewarmer:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - edbtoken_secret
        - edbrepository_secret
    deploy:
      resources:
        limits:
          cpus: 4.0
          memory: 4gb
        reservations:
          cpus: 1.0
          memory: 1gb
    secrets:
      - edbtoken_secret
      - edbrepository_secret
    ports:
      - "6432:5432"
    volumes:
      - ./data/coordinator/data:/whpgdata
#      - ./data/coordinator/gpadmin_ssh:/home/gpadmin/.ssh
#      - ./data/coordinator/root_ssh:/root/.ssh
#      - ./data/coordinator/etc_ssh:/etc/ssh
    environment:
      - container=docker
    platform: linux/amd64
    hostname: coordinator
    networks:
      whpg-sme-network:

  standby:
    depends_on:
      filesharewarmer:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - edbtoken_secret
        - edbrepository_secret
    deploy:
      resources:
        limits:
          cpus: 4.0
          memory: 4gb
        reservations:
          cpus: 1.0
          memory: 1gb
    secrets:
      - edbtoken_secret
      - edbrepository_secret
    ports:
      - "6433:5432"
    volumes:
      - ./data/standby/data:/whpgdata
#      - ./data/standby/gpadmin_ssh:/home/gpadmin/.ssh
#      - ./data/standby/root_ssh:/root/.ssh
#      - ./data/standby/etc_ssh:/etc/ssh
    environment:
      - container=docker
    platform: linux/amd64
    hostname: standby
    networks:
      whpg-sme-network:

  seg1:
    depends_on:
      filesharewarmer:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - edbtoken_secret
        - edbrepository_secret
    deploy:
      resources:
        limits:
          cpus: 4.0
          memory: 4gb
        reservations:
          cpus: 2.0
          memory: 2gb
    secrets:
      - edbtoken_secret
      - edbrepository_secret
    volumes:
      - ./data/seg1/data:/whpgdata
#      - ./data/seg1/gpadmin_ssh:/home/gpadmin/.ssh
#      - ./data/seg1/root_ssh:/root/.ssh
#      - ./data/seg1/etc_ssh:/etc/ssh
    environment:
      - container=docker
    platform: linux/amd64
    hostname: seg1
    networks:
      whpg-sme-network:

  seg2:
    depends_on:
      filesharewarmer:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - edbtoken_secret
        - edbrepository_secret
    deploy:
      resources:
        limits:
          cpus: 4.0
          memory: 4gb
        reservations:
          cpus: 2.0
          memory: 2gb
    secrets:
      - edbtoken_secret
      - edbrepository_secret
    volumes:
      - ./data/seg2/data:/whpgdata
#      - ./data/seg2/gpadmin_ssh:/home/gpadmin/.ssh
#      - ./data/seg2/root_ssh:/root/.ssh
#      - ./data/seg2/etc_ssh:/etc/ssh
    environment:
      - container=docker
    platform: linux/amd64
    hostname: seg2
    networks:
      whpg-sme-network:

  gpfdist:
    depends_on:
      filesharewarmer:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - edbtoken_secret
        - edbrepository_secret
    deploy:
      resources:
        limits:
          cpus: 2.0
          memory: 1gb
        reservations:
          cpus: 1.0
          memory: 1gb
    secrets:
      - edbtoken_secret
      - edbrepository_secret
    volumes:
      - ./data/gpfdist/data:/whpgdata
#      - ./data/gpfdist/gpadmin_ssh:/home/gpadmin/.ssh
#      - ./data/gpfdist/root_ssh:/root/.ssh
#      - ./data/gpfdist/etc_ssh:/etc/ssh
    environment:
      - container=docker
    platform: linux/amd64
    hostname: gpfdist
    networks:
      whpg-sme-network:


secrets:
  edbtoken_secret:
    environment: EDBTOKEN
  edbrepository_secret:
    environment: EDBREPOSITORY


networks:
  whpg-sme-network:
    driver: bridge
